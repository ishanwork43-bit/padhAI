[theme]
base = "light"
primaryColor = "#4F46E5"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F6FA"
textColor = "#172033"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Transport ceiling; MAX_UPLOAD_MB applies a configurable lower application limit.
maxUploadSize = 50
