name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    env:
      ONNXRUNTIME_NODE_INSTALL_CUDA: skip
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci
      - run: npm --prefix frontend ci
      - run: npm test
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run test:hosting
      - run: npm --prefix frontend run build:netlify
      - run: npm run test:security
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start static preview
        run: |
          npm --prefix frontend run preview -- --port 4176 --strictPort > /tmp/padhai-preview.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null http://localhost:4176; then exit 0; fi
            sleep 1
          done
          exit 1
      - run: npm --prefix frontend run test:e2e
        env:
          E2E_URL: http://localhost:4176
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: frontend/test-results
          retention-days: 3
